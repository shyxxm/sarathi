services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sarathi
      POSTGRES_PASSWORD: sarathi
      POSTGRES_DB: sarathi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarathi"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
