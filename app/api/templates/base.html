<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1118">
  <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}'>
  <title>{% block title %}Sarathi{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
  <script src="{{ url_for('static', path='voice.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/driver" aria-label="Sarathi home"><span class="brand-mark" aria-hidden="true">സ</span> SARATHI</a>
    <nav aria-label="Pages"><a href="/driver" {% if request.url.path.startswith('/driver') %}aria-current="page"{% endif %}>Driver</a><a href="/dispatcher" {% if request.url.path.startswith('/dispatcher') %}aria-current="page"{% endif %}>Dispatcher</a></nav>
    <span class="environment"><span class="status-dot"></span> DEMO SHIFT <span class="muted">/ IST</span></span>
  </header>
  <div id="connection-error" class="connection-error" role="status" hidden>Connection interrupted. Please try again. Unsent text is kept.</div>
  {% block content %}{% endblock %}
</body>
</html>
