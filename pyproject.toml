[project]
name = "sarathi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pgvector",
    "pydantic>=2",
    "litellm",
    "langfuse",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app/eval"]